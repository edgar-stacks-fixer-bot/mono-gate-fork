name: test:bot-pull-request
run-name: 'test: bot ${{ inputs.action }} ${{ inputs.branch }}${{ inputs.pr }}'

on:
  workflow_dispatch:
    inputs:
      action:
        description: open a pull request as github-actions[bot], or approve one
        type: choice
        options: [open, approve]
        required: true
      branch:
        description: Branch to create for open
        type: string
      pr:
        description: Pull request to approve
        type: string

permissions: {}

jobs:
  act:
    name: act
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: open
        if: inputs.action == 'open'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          echo "bot change in run $GITHUB_RUN_ID" > "gate-test-$GITHUB_RUN_ID.txt"
          git add "gate-test-$GITHUB_RUN_ID.txt"
          git commit -m "test: bot change on $BRANCH"
          git push origin "$BRANCH"
          gh pr create --base dev --head "$BRANCH" --title "test: bot change on $BRANCH" --body "Bot-authored pull request for the review gate test."

      - name: approve
        if: inputs.action == 'approve'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: gh pr review "$PR" --approve --body "Approval from github-actions[bot] for the review gate test."
