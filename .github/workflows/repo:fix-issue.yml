name: repo:fix-issue
run-name: 'fix-issue: #${{ inputs.issue }}'

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number the stub pretends to fix
        type: string
        required: true

permissions: {}

jobs:
  open-pull-request:
    name: open-pull-request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: open-bot-pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          BRANCH: bot/fix-issue-${{ inputs.issue }}-${{ github.run_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          echo "stub fix for #$ISSUE in run $GITHUB_RUN_ID" > "gate-test-$GITHUB_RUN_ID.txt"
          git add "gate-test-$GITHUB_RUN_ID.txt"
          git commit -m "fix: stub fix for #$ISSUE"
          git push origin "$BRANCH"
          gh pr create --base dev --head "$BRANCH" --title "fix: stub fix for #$ISSUE" --body "Stub fix-issue pull request for the review gate test."
